<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist</title>
</head>
<body>
    <div class="check-box">
        <h1>Checklist</h1>

        <fieldset>
            <legend>Graphics & Display</legend>

            <label for="fullscreen">
                <input type="checkbox" id="fullscreen" name="fullscreen" checked/>Fullscreen Mode
            </label>

            <label for="vsync">
                <input type="checkbox" id="vsync" name="vsync"/>V-Sync
            </label>

            <label for="motion">
                <input type="checkbox" id="motion" name="motion"/>Motion Blur
            </label>

            <label for="fps">
                <input type="checkbox" id="fps" name="fps"/>Show FPS Counter
            </label>

        </fieldset>
        </div>
</body>
</html>
