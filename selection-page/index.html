<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Page</title>

    <!-- Link to External CSS -->
    <link rel="stylesheet" href="./CSS/styles.css">
</head>

<body>

    <!-- Main Selection Card Container -->
    <div class="selection-card-container">

        <!-- Page Heading -->
        <h1>Working on Selection Page</h1>

        <!-- Frontend Selection Card -->
        <label for="card-one" class="card-container">
            <input type="checkbox" id="card-one" />Frontend
            <p>Frontend development focuses on building the visual, interactive parts of a website or application that users see and experience directly.</p>
        </label>

        <!-- Backend Selection Card -->
        <label for="card-two" class="card-container">
            <input type="checkbox" id="card-two" />Backend
            <p>Backend development manages the behind-the-scenes server logic, databases, and security that power the application's functionality.</p>
        </label>

        <!-- Full-Stack Selection Card -->
        <label for="card-three" class="card-container">
            <input type="checkbox" id="card-three" />FullStack
            <p>Full-stack development combines both frontend and backend skills to build and maintain an entire digital product from start to finish.</p>
        </label>

        <!-- Data Analytics and Data Science Selection Card -->
        <label for="card-four" class="card-container">
            <input type="checkbox" id="card-four" />Data Analyst and Science
            <p>Data science and analytics involve analyzing complex data sets to discover meaningful patterns and help businesses make smarter decisions.</p>
        </label>
        
    </div>

</body>
</html>
